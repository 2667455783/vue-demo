name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "SERVER_HOST set: ${{ secrets.SERVER_HOST != '' }}"
          echo "SERVER_USER set: ${{ secrets.SERVER_USER != '' }}"
          echo "SSH_KEY set: ${{ secrets.SSH_KEY != '' }}"
          echo "SERVER_DEPLOY_PATH_PROD set: ${{ secrets.SERVER_DEPLOY_PATH_PROD != '' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEST: ${{ secrets.SERVER_DEPLOY_PATH_PROD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Windows 粘贴的私钥常带 CR，会导致 publickey 认证失败
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -r dist/. "$USER@$HOST:$DEST/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" "sudo nginx -s reload"
