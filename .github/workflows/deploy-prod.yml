name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "SERVER_HOST set: ${{ secrets.SERVER_HOST != '' }}"
          echo "SERVER_USER set: ${{ secrets.SERVER_USER != '' }}"
          echo "SSH_KEY set: ${{ secrets.SSH_KEY != '' }}"
          echo "SERVER_DEPLOY_PATH_PROD set: ${{ secrets.SERVER_DEPLOY_PATH_PROD != '' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "dist/"
          target: ${{ secrets.SERVER_DEPLOY_PATH_PROD }}
          strip_components: 1
          overwrite: true
          timeout: 30s
          command_timeout: 2m

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: sudo nginx -s reload
