name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "SERVER_HOST set: ${{ secrets.SERVER_HOST != '' }}"
          echo "SERVER_USER set: ${{ secrets.SERVER_USER != '' }}"
          echo "SSH_KEY set: ${{ secrets.SSH_KEY != '' }}"
          echo "SERVER_DEPLOY_PATH_PROD set: ${{ secrets.SERVER_DEPLOY_PATH_PROD != '' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: SSH login check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_USER@$HOST" "whoami && pwd && ls -ld /var/www/vue-admin || true"

      - name: Upload dist
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEST: ${{ secrets.SERVER_DEPLOY_PATH_PROD }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$HOST" "mkdir -p '$DEST'"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -r dist/. "$DEPLOY_USER@$HOST:$DEST/"

      - name: Reload nginx
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$HOST" "sudo -n nginx -t && sudo -n nginx -s reload"
